language: python
dist: jammy
python:
  - "3.12"

env:
  global:
    # travis-ci.com builds report to Coveralls as travis-pro with
    # COVERALLS_REPO_TOKEN (set in Travis settings) so main gets a branch
    - COVERALLS_SERVICE_NAME=travis-pro

install:
  - pip install -r requirements.txt
  - pip install black flake8 coverage coveralls

script:
  - black --check .
  - flake8
  - coverage run manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  region: us-east-2
  app: swe1-app
  env: swe1-app-env
  bucket: elasticbeanstalk-us-east-2-173716783460
  on:
    branch: main
